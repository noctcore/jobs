# Read by .github/workflows/dependency-review.yml.

fail-on-severity: high
# Runtime and development alike: development dependencies run in CI.
fail-on-scopes: [runtime, development, unknown]

# Permissive licences. A new licence needs an explicit decision here.
allow-licenses:
  - MIT
  - MIT-0
  - ISC
  - 0BSD
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - BlueOak-1.0.0
  - CC0-1.0
  - CC-BY-4.0
  - Unlicense
  - Python-2.0
