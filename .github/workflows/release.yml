name: release

# Changesets two-phase release:
#   - PRs land with a changeset (`bun run changeset`) describing which packages bump.
#   - On push to main, if changesets are pending, the Changesets bot opens or updates a
#     "Version Packages" PR (bumps versions and writes CHANGELOGs).
#   - Merging that PR (no pending changesets) runs the publish step.
#
# Live publishing: the publish step is `bun run release`, which builds and runs
# `changeset publish`. Each package goes to npm through trusted publishing (OIDC:
# `id-token: write`, npm 11.5.1+, no npm token), with provenance from
# publishConfig.provenance and NPM_CONFIG_PROVENANCE. A trusted publisher (repository
# `noctcore/jobs`, workflow `release.yml`) is registered on npm for every package;
# a new package name needs one before its first publish (see RELEASING.md).
#
# changesets/action v2 creates the version commit, the release tags and their GitHub
# releases through the GitHub API with the `github-token` input, so the checkout keeps
# no git credentials. Tags and releases are created only for packages that were
# published, so a run with nothing to publish creates none.
#
# Prereleases (`changeset pre enter rc`) publish under the `rc` dist-tag; `next` is
# moved by hand. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Nothing at the top level: each job asks for exactly what it uses.
permissions: {}

jobs:
  release:
    name: version or publish
    # A manual dispatch from another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # version commit, release tags and GitHub releases (via the API)
      pull-requests: write # open and update the "Version Packages" PR
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Node 24 ships npm 11. Trusted publishing needs npm 11.5.1 or later; there is
      # no npm token to fall back to.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Require npm with trusted publishing support
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1, which trusted publishing needs'); process.exit(1) }" "$(npm --version)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action can't label the PR it opens. Its `pr-number` output is only set
      # on a versioning run. A failure here must not fail a run that may already have
      # published, hence continue-on-error.
      - name: Label and assign the Version Packages PR
        if: steps.changesets.outputs.pr-number != ''
        continue-on-error: true
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=release' --silent
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f 'assignees[]=Shironex' --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
