name: codeql

# Static analysis of the TypeScript sources with CodeQL's security-extended
# queries. Findings land in the Security tab (Code scanning) and, on a pull
# request, as annotations on the diff.
#
# TypeScript needs no build for CodeQL (build-mode: none). Build output is
# excluded in .github/codeql/codeql-config.yml so the results are about code
# this repo writes and ships.
#
# Every action is pinned to a full commit SHA with its version beside it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run against code that has not changed.
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql · javascript-typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
