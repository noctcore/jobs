name: dependency review

# Fails a pull request that adds or bumps a dependency with a known advisory of
# high severity or worse, or with a licence outside the allowlist in
# .github/dependency-review-config.yml.
#
# Development dependencies count too: they run in CI with access to the
# release job.
#
# Every action is pinned to a full commit SHA with its version beside it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
